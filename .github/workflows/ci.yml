name: ci

on:
  push:
  pull_request:
  # 每日定时跑 mem-regression（spec directory-structure：每日 + PR 触发）
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    # 本地开发用 windows-gnu 工具链，CI 用 runner 自带 MSVC——源码级兼容，产物不交叉使用
    steps:
      - uses: actions/checkout@v4
      # 工具链版本钉死：channel 以 rust-toolchain.toml 为单一真相源，不再浮动 stable
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
      # EOF newline 守卫：git diff --check 抓不到缺尾换行（已实证），独立扫末字节。
      - name: 检查跟踪文本文件以 LF 结尾（EOF newline）
        shell: pwsh
        run: |
          $binExts = @('.png','.jpg','.jpeg','.webp','.ico','.mp4','.webm','.mp3','.wav','.db','.sqlite','.exe','.dll','.zip','.gz','.tar','.pdf','.wasm')
          $bad = @()
          git ls-files | ForEach-Object {
            $f = $_
            if ($binExts -contains [IO.Path]::GetExtension($f).ToLowerInvariant()) { return }
            $b = [IO.File]::ReadAllBytes($f)
            if ($b.Length -gt 0 -and $b[$b.Length - 1] -ne 10) { $bad += $f }
          }
          if ($bad.Count -gt 0) { Write-Error ('以下文件缺少 EOF 换行：' + ($bad -join ', ')); exit 1 }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # deny 不再排除 schedule：RustSec 公告库是持续变化的外部输入，每日定时扫描才有价值。
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      # cargo-deny 版本钉死：deny.toml 的配置 schema 随版本漂移过（见 [licenses] 注释）
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories bans licenses

  # M7 内存回归（DECISIONS.md 行动项 A3）：预算超标即红，趋势产物存 artifact。
  # release 档出正式数字（D10 合同以发布形态为准）。
  mem-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: build (release)
        run: cargo build --workspace --release
      # harness 自身红灯测试（生成器行数/闭环计时）；ignored 的 RSS 断言与下方 CLI 双保险
      - name: bench-harness ignored specs
        run: cargo test -p bench-harness --release -- --ignored --nocapture
      - name: generate synthetic library
        run: cargo run -p bench-harness --release -- generate --rows 100000 --out ${{ runner.temp }}/synth-lib
      - name: idle RSS <= 100MB (D10)
        run: cargo run -p bench-harness --release -- measure-rss --exe target/release/asset-manager.exe --library ${{ runner.temp }}/synth-lib --mode idle --budget-mb 100 --json-out ${{ runner.temp }}/trend-idle.json
      - name: browse 100k RSS <= 250MB (D10)
        run: cargo run -p bench-harness --release -- measure-rss --exe target/release/asset-manager.exe --library ${{ runner.temp }}/synth-lib --mode browse --budget-mb 250 --json-out ${{ runner.temp }}/trend-browse.json
      - name: upload trend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mem-regression-trend
          path: ${{ runner.temp }}/trend-*.json
          if-no-files-found: ignore

  # 统一打包（scripts/package.ps1）：一条流水线产出便携版 zip + 自解压安装版 exe。
  # 质量门禁（lint/test + 许可证）通过后，每次 push/PR 都产出可下载候选包。
  package:
    needs: [lint-and-test, deny]
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: 统一打包（便携版 + 安装版）
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -Stage all
      - name: 上传便携版
        uses: actions/upload-artifact@v4
        with:
          name: asset-manager-portable
          path: artifacts/*.zip
          if-no-files-found: error
      - name: 上传安装版
        uses: actions/upload-artifact@v4
        with:
          name: asset-manager-installer
          path: artifacts/*.exe
          if-no-files-found: error
      - name: 上传校验和清单
        uses: actions/upload-artifact@v4
        with:
          name: asset-manager-checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error

  # 打 v* tag（如 v0.1.0）时发布正式版：
  # 内存预算（D10）+ 质量/许可证门禁全绿后，把候选包发布到 GitHub Release。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, mem-regression, deny]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 发布门禁：产物命名取自 Cargo.toml 的 version（scripts/package.ps1），
      # tag 不一致就会发出错名正式包——发布前强校验。
      - name: 校验 tag 与 Cargo.toml 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VER="$(grep -m1 -E '^version *= *"' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::git tag v$TAG 与 Cargo.toml version=$CARGO_VER 不一致——升版本后再打 tag"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: asset-manager-portable
          path: release/portable
      - uses: actions/download-artifact@v4
        with:
          name: asset-manager-installer
          path: release/installer
      - uses: actions/download-artifact@v4
        with:
          name: asset-manager-checksums
          path: release/checksums
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*/*
          generate_release_notes: true
