[package]
name = "ui-viewmodels"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
domain = { path = "../domain" }
index = { path = "../index" }
media = { path = "../media" }
# 库目录装载（catalog_loader）：spec 规划依赖之一（directory-structure.md）；
# app-ui 白名单只有本 crate + slint，Store 门面访问收拢在此层。
store = { path = "../store" }
targets = { path = "../targets" }
pipeline = { path = "../pipeline" }
platform = { path = "../platform" }
lru = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1"
# D56 更新检查：GitHub release 清单是 JSON。serde_json 已在依赖树里
# （Cargo.lock 既有条目），升为直接依赖不新增任何 vendored crate。
serde_json = "1"
# D42（上框解绑竞态自愈）落地：target_runtime 直接使用 log facade。
log = "0.4"

[dev-dependencies]
criterion = "0.5"
# D61 分类保留端到端测试：模拟 v0.1.0 用户迁移（真库导入链路）
library = { path = "../library" }
tempfile = "3"
image = "0.25"
# 造 v0.1.0 schema v4 旧库（与 store 共享底层 rusqlite，不新增 vendored crate）
rusqlite = "0.32"

[[bench]]
name = "layout"
harness = false
