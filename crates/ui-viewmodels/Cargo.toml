[package]
name = "ui-viewmodels"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
domain = { path = "../domain" }
index = { path = "../index" }
media = { path = "../media" }
# 库目录装载（catalog_loader）：spec 规划依赖之一（directory-structure.md）；
# app-ui 白名单只有本 crate + slint，Store 门面访问收拢在此层。
store = { path = "../store" }
targets = { path = "../targets" }
pipeline = { path = "../pipeline" }
platform = { path = "../platform" }
lru = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1"
# D42（上框解绑竞态自愈）落地：target_runtime 直接使用 log facade。
log = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "layout"
harness = false
