[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# 架构边界方向（spec）：pipeline 依赖 domain + platform(trait)，不依赖 win32 实现。
domain = { path = "../domain" }
platform = { path = "../platform" }
targets = { path = "../targets" }
serde = { version = "1", features = ["derive"] }
# 纯门面（零传递依赖）：上框成功路径的分段耗时瀑布（D39：上框=Info 级低频重要事件）。
log = "0.4"

[dev-dependencies]
serde_json = "1"
