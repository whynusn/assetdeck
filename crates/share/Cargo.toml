[package]
name = "share"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# 架构边界方向（D80）：纯模型零 IO；iroh/tokio 只进 tools/share-worker，
# ui-viewmodels 的共享 VM 只吃本 crate 类型。
domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
# 事件行解析（events）吃 JSON：INCOMING 清单 / STAGED 路径数组。
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
