[package]
name = "platform"
version.workspace = true
edition.workspace = true
publish.workspace = true

# 依赖纪律（spec/platform 红线 1）：trait 层 lib.rs 零依赖；
# windows-sys 仅被 #[cfg(windows)] 的 win32 模块消费，用 target 门隔离，
# 非 Windows 目标编译本 crate 时 trait 层不受影响。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 集成测试 win32_manual 直接调用 Win32 API 轮询前台窗口进程归属。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
