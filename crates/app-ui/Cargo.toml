[package]
name = "app-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "asset-manager"
path = "src/main.rs"

[dependencies]
ui-viewmodels = { path = "../ui-viewmodels" }
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
] }

[build-dependencies]
slint-build = "1"
