[meta]
id = "peach-cat"
name = "桃桃猫"
author = "AssetDeck"
version = "1.0.0"
base = "light"
description = "奶油桃粉 · 软圆角 · 小猫陪伴"
license = "MIT"

[palette]
bg-app = "#fff7f5ff"
bg-panel = "#fff0edff"
bg-bar = "#fbe8e5ff"
bg-raised = "#fffaf9ff"
bg-raised-hover = "#f9e2e5ff"
bg-raised-press = "#f3d6dcff"
bg-input = "#fffdfcff"
line = "#e8cdd2ff"
line-strong = "#c7a0aaff"
control-track-border = "#94717cff"
text = "#402b36ff"
text-2 = "#624650ff"
text-3 = "#795764ff"
accent = "#a33261ff"
accent-hover = "#902451ff"
accent-press = "#7c1c43ff"
accent-ink = "#ffffffff"
accent-soft = "#f8dfe8ff"
danger = "#b32b40ff"
danger-soft = "#ffe3e7ff"
danger-press = "#9e2337ff"
danger-ink = "#FFFFFFFF"
warn = "#80500aff"
warn-soft = "#fff0d8ff"
ok = "#286b4fff"
ok-soft = "#e4f3e9ff"
shared = "#7d398cff"
shared-soft = "#f3e6f7ff"
bg-overlay = "#fffaf9ff"
scrim = "#00000033"
label-bar-bg = "#fff7f5f0"
label-bar-bg-hover = "#fff7f5ff"
label-bar-text = "#624650ff"
badge-bg = "#00000099"
badge-text = "#FFFFFFFF"
badge-ring = "#FFFFFFCC"
tile-veil = "#FFFFFFD9"
card-icon = "#91546eff"

[geometry]
radius = "9px"
radius-lg = "16px"
tile-radius = "12px"
tile-gap = "12px"
density = "comfortable"
row-height = "32px"
control-height = "34px"
bar-height = "52px"

[typography]
font-family = "Microsoft YaHei UI"
font-size-scale = "1.0"

[icons]
stroke-weight = "1.9"
line-cap = "round"
size = "17px"
set = "line"

[motion]
fast = "120ms"
state = "140ms"
enter = "180ms"
easing = "ease-out"

[decoration]
corner = "assets/cat.png"
corner-scale = "1.0"
