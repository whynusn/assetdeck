# M8 内置目标画像。
#
# 本文件内容已用 OpenDesktop("default") 对交互桌面做真实窗口枚举回填（2026-08-23）。
# 值来源：Admin 桌面会话枚举得出的进程名 / 窗口类名 / 标题模板，非猜测。
#
# readiness 一律为 uia_shallow：真实实测证明 Qt 自绘（微信）与 CEF（千牛）都无法事前
# 证明「存在可写输入框」，而 caret / UIA 焦点探测在能成功粘贴的窗口上同样返回空值。
# 因此策略是「否证阻塞才不注入」而非「证明就绪才注入」，探测不到就注入并标 unverified。
# uia_strict 保留为用户可显式开启的严格档，不作为内置默认。
#
# paste_sends 记录「该格式粘进去等于直接发送」的实测事实，按素材类别分行声明。
# 2026-08-25 受控复验推翻了「千牛对 CF_HDROP 一律即发」的旧概括：
# 千牛接待中心对**视频** HDROP 是立即发出，对**图片** HDROP 则停在输入框并渲染
# 真缩略图（取证 q3-our-hdrop-image.png）；微信 4.0 两者都停在输入框，且图片
# HDROP 按下发送后发出的是图片消息而非文件卡片（取证 v6-wx-hdrop-sent.png）。
# 所以即发是 (类别 × 格式) 事实，不是纯格式事实。
#
# 图片的格式顺序由此定为 files 优先、png 兜底。理由是实测的进程成本：同一张
# 4096x3072 素材，走 HDROP 时对端只向外壳要几百像素缩略图，微信全流程 436ms /
# 进程 CPU ~250ms、千牛 1027ms / CPU 125ms；走 CF_PNG 时对端必须在自己进程里
# 全量解码 8.84MB PNG，微信 2061ms / CPU 1859~2031ms、千牛 3346ms / CPU 2234ms。
# 这段开销在对方进程内，我们的 timing[paste] 量不到，只体现为用户看到的卡顿。
# png 保留在末位是兜底：素材不在本地库内（无可交路径）时仍能上框。
#
# input_anchor 是「激活窗口后把键盘焦点送进输入框」的兜底锚点（客户区宽高比例）。
# 实测事实：SetForegroundWindow 之后焦点停在窗口根控件（Qt 自绘 / CEF 都不暴露可
# SetFocus 的输入框），Ctrl+V 会落空。平台层先试 UIA SetFocus，失败才对锚点做一次
# 左键单击。比例值由 2026-08-24 真机截图量取，随窗口缩放仍成立。
#
# input_anchor_bottom（D74，2026-09-04）是升级版锚点：客户区底边向上的物理像素
# 距离（96 DPI 基准声明，运行时按 GetDpiForWindow 缩放），声明后优先于 input_anchor。
# 为什么换模型：2026-09-03 测试用户「报成功但没落框」实锤了比例锚的失效机理——
# 聊天应用的底栏（工具栏/合规提示条）是**定高**的，比例 y 随窗高线性上漂，窗口
# 高过 ~1300 物理像素后比例点就越过输入框落进消息列表，Ctrl+V 落空但全程报成功。
# 锚定底边则与窗高完全解耦。已量取的画像逐一回填；未量取的（微信，登录窗口未能
# 自动进入）保留比例锚，量取前不动。
#
# focus_strategy 声明聚焦级别顺序，省略即取缺省 ["already", "uia", "anchor"]。
# 概念动作是「把焦点放入目标应用的输入框」；级别=可选用的机制清单，哪个机制
# 对哪个目标有效是**观测事实数据**，不是代码分支——拼多多实测无法以任何点击
# 恢复焦点，其画像就只有 ["already", "anchor"]，零代码差异。
# 微信 / 千牛显式去掉 "uia"：实测这两个目标的 UIA 子树里可写 Edit/Document 候选数为 0
# （微信 descendant count=2、千牛 91 个全不可写），该级别必然失败，白付 22~83ms。
# pdd 2026-09-01 真机实测同样裁掉 "uia"（editable=0，且 prop 条件变体 109~124ms，
# 比千牛 83ms 更贵）；telegram 未取得真机会话，保留三级缺省，不凭猜测裁剪。
#
# 图片格式顺序：全部画像统一 files 优先（D22，2026-08-27 回填完 pdd/telegram）。
# pdd/telegram 此前残留 ["png", "files"] 是 D22 落地时的回填遗漏——files 优先与
# 是否实测过该目标无关：它同时压缩对端解码成本（实测微信 files 436ms vs png 2061ms）
# 和触发侧成本（D41：物化层已不再预读 png_bytes，files 承载是零 IO 路径）。
# 例外：pdd 的图片 2026-09-01 实测收成 ["files"] 单格式——CF_PNG 粘贴无反应
# （网页层不认注册格式 "PNG"），png 兜底声明了只会把「素材不在库内」变成
# 假成功的空注入，宁走 Unsupported 诚实报错。

[[profiles]]
id = "wechat"
label = "微信 (4.0)"
exe_names = ["Weixin.exe"]
class_names = ["Qt51514QWindowIcon"]
title_regexes = ["^微信$"]
# 微信不启用 require_title（严格档）：独立聊天窗口标题是联系人名，靠类名兜住
# 才是合法上框目标；微信杂窗口少、弹窗不抢前台，宽松档的误配风险可接受。
not_ready_title_regexes = ["微信登录", "微信未登录"]
readiness = "uia_shallow"
settle_ms = 150
# 实测微信 4.0 对图片与视频的 CF_HDROP 都停在输入框，无需排除任何组合。
paste_sends = { image = [], video = [], text = [], other = [] }
# 实测：UIA 全子树扫描在微信 4.0 上耗 22~27ms 且候选数 0，跳过。
# 2026-09-05 实测：input_point 级（点击式聚焦机制）对本目标有效——点击窗口
# 右下角内缩点，composer（UIA class=mmui::ChatInputField）10/10 轮恢复键盘
# 焦点；贴角 0px 会被尺寸调整边框吞掉（HTCLIENT 守卫已内建）。优先于旧比例锚点。
focus_strategy = ["already", "input_point", "anchor"]

# 微信 4.0 主窗口 1342x971 时输入框位于底部图标行之上、正文列中部偏右。
[profiles.input_anchor]
x_ratio = 0.66
y_ratio = 0.85

# 点击式聚焦机制的坐标参数（2026-09-05 真机实测）：本机版式的有效点是右下角
# 内缩 8 逻辑像素（=12 物理像素@150% DPI，实测有效带 4~20 物理像素的中段）。
# 你的设备版式若不同，直接改写表达式（变量 WINDOW_WIDTH/WINDOW_HEIGHT =
# 客户区逻辑宽高，实时求值；四角内缩与窗口内任意一点是同一配置面）。
[profiles.input_point]
x = "WINDOW_WIDTH - 8"
y = "WINDOW_HEIGHT - 8"

[profiles.formats]
image = ["files", "png"]
video = ["files"]
text = ["text"]
other = []

[[profiles]]
id = "qianniu"
# 画像覆盖千牛的两个主窗口（工作台 / 接待中心），label 不写死「工作台」以免
# 接待中心候选显示成「千牛工作台 · …-接待中心」这种自相矛盾的名字。
label = "千牛"
exe_names = ["AliWorkbench.exe"]
class_names = ["Qt5152QWindowIcon"]
# 会话窗口标题存在用户级变体（2026-08-29 用户反馈：部分用户是「接待台」而
# 非「接待中心」），正则枚举两者；工作台 / 登录窗照旧。
# 接待中心（会话窗口）标题形如 `tb940472610424-接待中心`，是真正带输入框的上框目标，
# 必须显式声明，不能依赖 `-千牛工作台` 的巧合匹配。
title_regexes = ["接待(中心|台)$", "千牛工作台", "千牛登录"]
not_ready_title_regexes = ["千牛登录"]
# 严格档：类名+标题必须同时命中。千牛所有普通 Qt 窗口共享 Qt5152QWindowIcon
# 类名（Qt 按运行时版本命名），宽松档下优惠弹窗/活动窗会命中画像——真机实证
# （2026-08-29）弹窗抢前台后静默顶替热目标，下次上框拉起的就是弹窗。严格档让
# 标题成为会话窗口的身份门槛，弹窗不再匹配、不再进候选、不再可能被激活。
require_title = true
readiness = "uia_shallow"
settle_ms = 120
# 实测：CF_UNICODETEXT 与 CF_PNG 停在输入框；CF_HDROP 的结论按类别分叉——
# 视频 HDROP 直接发送到会话流（qn-round3-video.png），图片 HDROP 停在输入框
# 并显示真缩略图（q3-our-hdrop-image.png，会话流无新消息）。因此只把
# video × files 标为即发，图片得以走 files 的低成本路径。
paste_sends = { image = [], video = ["files"], text = [], other = [] }
# 实测：UIA 全子树扫描在千牛接待中心（CEF）上耗 83ms 且可写候选数 0，跳过。
# 2026-09-05 实测：input_point 级（点击式聚焦机制）对本目标有效，但**有效点
# 不是窗口边角**——左下角内缩 8~16 物理像素 ×8 轮、四角极限点 ×16 轮均不能
# 恢复 composer（左下角是原生侧栏），只有点进中栏输入框本体内部才出 caret
#（9/10 轮 + 粘贴截图复核）。caret_semantic 保留在前面：composer 已获焦时
# 零动作直接确认，最快路径。
focus_strategy = ["already", "caret_semantic", "input_point", "anchor"]

# 千牛接待中心 1845x1200 时会话输入框在中栏下部；锚点必须落在中栏，
# 右侧是「千牛工单」面板，点错会把焦点送进工单搜索框。
[profiles.input_anchor]
x_ratio = 0.394
y_ratio = 0.787

# D74 底部锚（2026-09-04 真机量取）：文本区在客户区底边向上 80~295 物理像素
# 之间（工具栏图标行之上），取带中心 ≈127 逻辑像素；
# x 沿用比例锚的 0.394（中栏中部，避开右侧工单面板）。
[profiles.input_anchor_bottom]
x_ratio = 0.394
y_from_bottom = 127

# caret 语义确认的身份声明（caret_semantic 级用）：点击输入框后原生 caret 所在点
# 的 MSAA role/name。与缺省值相同，显式写出便于用户按自己的千牛变体改写
# （其他 IM 的 caret 对象语义不同，在此声明，平台层不做 per-app 判断）。
[profiles.caret_semantic]
expected_role = 7
expected_name = "编辑"

# 点击式聚焦机制的坐标参数（2026-09-05 真机实测）：本机版式的有效点是中栏
# 输入框内部（底边向上 75 逻辑像素 = 831 物理像素@150% DPI、实测 caret 复现带
# 780~860 的中部；x 取输入框中部 413 逻辑 = 620 物理实测点）。x 必须给绝对值
# 而非窗口比例——右侧是「千牛工单」面板，比例会漂进工单；左下角边角内缩在本机
# 实测无效（见 focus_strategy 注释）。你的机型若实测边角有效，改成
# x="8" y="WINDOW_HEIGHT - 8" 即可，无需改代码。
[profiles.input_point]
x = "413"
y = "WINDOW_HEIGHT - 75"

[profiles.formats]
image = ["files", "png"]
video = ["files"]
text = ["text"]
other = []

[[profiles]]
id = "pdd"
label = "拼多多商家版"
exe_names = ["PddWorkbench.exe"]
# 主窗口类名带实例级 GUID 后缀（g_wszPDDWindowClass{E77EAED1-...}，2026-09-01
# 真机复证），matcher 的 {GUID} 变体规则按前缀命中。宽松档（不声明
# require_title）：DUI 框架给每个弹窗注册独立类名（FaceWnd/ShadeWindow/
# CUrgentTip 等 38 个顶层窗口无一与主类重名），「类名全应用共享」的千牛
# 式误绑前提在这里不存在；而类名本身已是强身份信号（同微信的宽松理由）。
class_names = ["g_wszPDDWindowClass"]
title_regexes = ["拼多多工作台"]
not_ready_title_regexes = ["登录"]
readiness = "uia_shallow"
settle_ms = 120
# 2026-09-01 借号真机受控实验（商家工作台客服聊天页；注入前核前台、全程无
# Enter、粘后即清空输入框）：
# - 图片（png/jpg）CF_HDROP 停在输入框并内嵌渲染（取证 Default_Project_probe/
#   pdd-hdrop-image.png / pdd-jpg-hdrop.png），无需即发保护；
# - CF_PNG（注册格式 "PNG"，与产品写法 RegisterClipboardFormatA 同参）粘贴
#   无任何反应（pdd-png-noop.png，输入框仍空）——png 兜底是死路，见头部注释；
# - 文本 CF_UNICODETEXT 停在输入框（pdd-text.png）；
# - 视频等文件用户实测无法粘贴上框（用户 2026-09-01 确认），video 行置空 →
#   协商 Unsupported，管线报「无法承载」并连剪贴板都不写，不注入必落空的
#   Ctrl+V。拼多多 v1 只适配图片素材。
paste_sends = { image = [], video = [], text = [], other = [] }
# 实测（focus_probe 三轮）：CEF 主窗口（Chrome_RenderWidgetHostHWND），激活后
# 焦点停在根控件/浮动提示，UIA 全子树 editable=0；prop 条件变体 109~124ms。
focus_strategy = ["already", "anchor"]

# 客服输入框锚点（1875x1185 客户区实测量取，2026-09-01）：文本区在会话列
# 下部、工具栏图标行之下、黄色合规提示条之上，客户区比例 x 0.29~0.69 /
# y 0.88~0.96，锚点取文本区中心；发送按钮在 x≈0.63 起，横向有余量。
[profiles.input_anchor]
x_ratio = 0.49
y_ratio = 0.92

# D74 底部锚（2026-09-03 借号真机量取）：文本区在底边向上 55~150 物理像素
# 之间（工具栏行之上、合规提示条之下），取带中心 ≈66 逻辑像素；x 沿用 0.49。
# 注意：此值只在真机上做过几何量取，端到端实贴 E2E 因账号收回未跑（2026-09-04），
# 用户侧拿到账号后需补一次受控实贴复核。
[profiles.input_anchor_bottom]
x_ratio = 0.49
y_from_bottom = 66

[profiles.formats]
image = ["files"]
video = []
text = ["text"]
other = []

[[profiles]]
id = "telegram"
label = "Telegram"
exe_names = ["Telegram.exe"]
class_names = ["Qt51514QWindowIcon"]
readiness = "uia_shallow"
settle_ms = 80
paste_sends = []

[profiles.formats]
