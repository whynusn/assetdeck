[workspace]

[package]
name = "asset-installer"
# 独立 workspace 的内部版本号：分发产物命名取主 workspace [workspace.package].version
# （scripts/package.ps1 读取），此版本号不参与命名，勿当第二版本真相源。
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "asset-installer"
path = "src/main.rs"

[dependencies]
flate2 = "1"
tar = "0.4"

# exe 资源图标（Windows 专用，见 build.rs）；MIT，过主仓 deny licenses 白名单。
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# gnu 构建脚本把资源路径换 8.3 短路径规避 windres 空格坑（见 build.rs）。
[target.'cfg(all(windows, target_env = "gnu"))'.build-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
# 快捷方式走原生 COM（IShellLinkW+IPersistFile）与 SHGetKnownFolderPath，
# 取代此前 4 次 powershell.exe 子进程——GUI 进程 spawn 控制台程序会弹黑框。
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
