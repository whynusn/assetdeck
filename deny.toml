[advisories]
version = 2
# RustSec 门禁策略：vulnerability/unsound 保持默认全量 deny（lru 两条 unsound 已随 0.18.3 升级清零）；
# unmaintained 限 workspace 作用域——现存三条（paste/rustybuzz/ttf-parser）全是 Slint 1.17.1 + image
# 的传递依赖且无安全升级可走，作用域外的发现降级为警告；等 Slint 升级自然消化，hard gate 只留给
# 可修的真问题（直接依赖 unmaintained 仍会红灯）。
unmaintained = "workspace"
# ci.yml 的 deny job 已放开每日 schedule 触发——公告库是持续变化的外部输入，定时扫描才有价值。

[bans]
multiple-versions = "warn"
deny = [
    # DECISIONS.md D4 红线：v1 禁止向量检索 / 模型运行时依赖
    { name = "faiss" },
    { name = "usearch" },
    { name = "hnsw_rs" },
    { name = "instant-distance" },
    { name = "ort" },
    { name = "candle-core" },
    { name = "tch" },
    { name = "tract-onnx" },
    { name = "qdrant-client" },
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "NCSA",
    # copyleft 白名单：cargo-deny 新版移除了 copyleft 键（EmbarkStudios/cargo-deny#611），
    # 语义从「copyleft 全部 warn」收窄为「显式放行所需许可证」。Slint 社区版为 GPLv3，
    # 行动项 A1（许可证路线）未裁决前在此放行——收紧时先裁决 A1。
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "GPL-2.0-only",
    "LGPL-3.0-only",
]
