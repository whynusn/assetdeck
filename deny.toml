[bans]
multiple-versions = "warn"
deny = [
    # DECISIONS.md D4 红线：v1 禁止向量检索 / 模型运行时依赖
    { name = "faiss" },
    { name = "usearch" },
    { name = "hnsw_rs" },
    { name = "instant-distance" },
    { name = "ort" },
    { name = "candle-core" },
    { name = "tch" },
    { name = "tract-onnx" },
    { name = "qdrant-client" },
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# copyleft 仅 warn 不 deny：Slint 社区版为 GPLv3，行动项 A1（许可证路线）未裁决前不收紧
copyleft = "warn"
